name: Ubuntu 24.04 HTTPS lab verification
on:
  push:
    branches: [lab/ubuntu-https-2026-11-08]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  https-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure CA, Nginx and capture Ubuntu checks
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export NO_PROXY="server.lab,localhost,127.0.0.1"
          export no_proxy="$NO_PROXY"
          DIR="/tmp/https-lab-evidence"
          CA="/tmp/https-lab-ca"
          mkdir -p "$DIR" "$CA/private" "$CA/certs" "$CA/csr"
          chmod 700 "$CA/private"
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl curl ca-certificates xvfb xterm scrot libnss3-tools fonts-dejavu-core
          { echo "Ubuntu version"; cat /etc/os-release; echo; echo "Linux kernel"; uname -r; echo; echo "Versions"; nginx -v 2>&1; openssl version; } > "$DIR/01_ubuntu_version.txt"
          openssl rand -base64 32 > "$CA/private/pass"
          chmod 600 "$CA/private/pass"
          openssl genrsa -aes256 -passout "file:$CA/private/pass" -out "$CA/private/lab-ca.key" 4096
          openssl req -x509 -new -sha256 -days 3650 -key "$CA/private/lab-ca.key" -passin "file:$CA/private/pass" -out "$CA/certs/lab-ca.crt" -subj "/C=RU/O=College Lab/OU=Network Security/CN=College Lab Root CA" -extensions v3_ca
          sudo mkdir -p /etc/nginx/ssl
          sudo openssl genrsa -out /etc/nginx/ssl/server.lab.key 2048
          sudo chmod 600 /etc/nginx/ssl/server.lab.key
          printf '[v3_req]\nbasicConstraints=CA:FALSE\nsubjectAltName=DNS:server.lab,IP:127.0.0.1\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > "$CA/server-ext.cnf"
          sudo openssl req -new -key /etc/nginx/ssl/server.lab.key -out "$CA/csr/server.lab.csr" -subj "/C=RU/O=College Lab/OU=Web/CN=server.lab"
          openssl x509 -req -sha256 -days 825 -in "$CA/csr/server.lab.csr" -CA "$CA/certs/lab-ca.crt" -CAkey "$CA/private/lab-ca.key" -passin "file:$CA/private/pass" -CAcreateserial -out "$CA/certs/server.lab.crt" -extfile "$CA/server-ext.cnf" -extensions v3_req
          { echo "Root CA"; openssl x509 -in "$CA/certs/lab-ca.crt" -noout -subject -issuer -dates; openssl x509 -in "$CA/certs/lab-ca.crt" -noout -text | grep -A3 'Basic Constraints'; echo; echo "Server certificate"; openssl x509 -in "$CA/certs/server.lab.crt" -noout -subject -issuer -dates; openssl x509 -in "$CA/certs/server.lab.crt" -noout -text | grep -A2 'Subject Alternative Name'; echo; echo "Signature verification"; openssl verify -CAfile "$CA/certs/lab-ca.crt" "$CA/certs/server.lab.crt"; } > "$DIR/02_certificates.txt"
          sudo cp "$CA/certs/server.lab.crt" /etc/nginx/ssl/server.lab.crt
          echo '<!doctype html><html><head><meta charset="utf-8"><title>server.lab</title></head><body><h1>HTTPS server.lab works!</h1><p>College Lab Root CA</p></body></html>' | sudo tee /var/www/html/index.html >/dev/null
          sudo tee /etc/nginx/conf.d/server-lab.conf >/dev/null <<'NGINX'
          server {
            listen 80;
            server_name server.lab;
            return 301 https://$host$request_uri;
          }
          server {
            listen 443 ssl;
            server_name server.lab;
            ssl_certificate /etc/nginx/ssl/server.lab.crt;
            ssl_certificate_key /etc/nginx/ssl/server.lab.key;
            root /var/www/html;
            index index.html;
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          echo '127.0.0.1 server.lab' | sudo tee -a /etc/hosts >/dev/null
          sudo nginx -t
          sudo systemctl restart nginx
          { echo "Nginx syntax"; sudo nginx -t; echo; echo "Port 443"; sudo ss -ltnp | grep ':443'; echo; echo "HTTP redirect"; curl --noproxy '*' -I http://server.lab/; } > "$DIR/03_nginx.txt" 2>&1
          { echo "Before importing root CA"; curl --noproxy '*' -I https://server.lab/ || true; } > "$DIR/04_before_trust.txt" 2>&1
          sudo cp "$CA/certs/lab-ca.crt" /usr/local/share/ca-certificates/college-lab-root-ca.crt
          sudo update-ca-certificates > "$DIR/05_trust_store.txt" 2>&1
          { echo "Verified HTTPS connection"; curl --noproxy '*' --fail -I https://server.lab/; echo; echo "TLS certificate validation"; echo | openssl s_client -connect server.lab:443 -servername server.lab -verify_hostname server.lab -CAfile "$CA/certs/lab-ca.crt" 2>&1 | grep -E 'Verify return code|Verification:|subject=|issuer='; echo; echo "HTML page"; curl --noproxy '*' --fail -s https://server.lab/; } > "$DIR/06_https_verified.txt" 2>&1
          grep -q 'HTTP/1.1 200 OK' "$DIR/06_https_verified.txt"
          grep -q 'Verify return code: 0 (ok)' "$DIR/06_https_verified.txt"
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb" || true
          certutil -A -d "sql:$HOME/.pki/nssdb" -n 'College Lab Root CA' -t 'C,,' -i "$CA/certs/lab-ca.crt"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "$DIR/xvfb.log" 2>&1 &
          sleep 2
          for pair in "01_ubuntu_version" "02_certificates" "03_nginx" "06_https_verified"; do
            xterm -geometry 125x35+30+30 -fa 'DejaVu Sans Mono' -fs 12 -bg '#300a24' -fg white -T "Ubuntu 24.04 - $pair" -e bash -c "cat '$DIR/$pair.txt'; sleep 12" &
            XTERM_PID=$!
            sleep 3
            scrot "$DIR/$pair.png"
            kill "$XTERM_PID" 2>/dev/null || true
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            mkdir -p /tmp/lab-chrome
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-proxy-server --user-data-dir=/tmp/lab-chrome --window-size=1200,800 --dump-dom https://server.lab/ > "$DIR/07_browser_dom.html" 2> "$DIR/07_browser_log.txt" || true
            if grep -q 'HTTPS server.lab works!' "$DIR/07_browser_dom.html"; then
              "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-proxy-server --user-data-dir=/tmp/lab-chrome --window-size=1200,800 --screenshot="$DIR/07_browser_verified.png" https://server.lab/ >> "$DIR/07_browser_log.txt" 2>&1 || true
              echo 'Browser DOM matched HTTPS page' >> "$DIR/07_browser_log.txt"
            else
              echo 'Browser HTTPS verification not confirmed; check browser log' >> "$DIR/07_browser_log.txt"
            fi
          else
            echo 'No Chrome executable on runner' > "$DIR/07_browser_log.txt"
          fi
          cp "$CA/certs/lab-ca.crt" "$DIR/lab-ca.crt"
          cp "$CA/certs/server.lab.crt" "$DIR/server.lab.crt"
      - name: Upload verification images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-https-evidence
          path: /tmp/https-lab-evidence/
          if-no-files-found: warn
